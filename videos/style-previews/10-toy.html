<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;overflow:hidden}canvas{width:1080px;height:1920px;display:block}
.blur{position:absolute;left:0;right:0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#top{top:0;height:700px;-webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}
#bot{bottom:0;height:640px;-webkit-mask-image:linear-gradient(transparent,#000 60%);mask-image:linear-gradient(transparent,#000 60%)}
#cap{position:absolute;left:50%;top:1440px;transform:translate(-50%,-50%) rotate(-2deg);background:#fffaf0;color:#e05a4a;font:800 70px Inter,sans-serif;padding:16px 46px;border-radius:26px;box-shadow:0 8px 0 #f0c8b0,0 14px 30px rgba(0,0,0,.18);letter-spacing:4px}
</style></head><body><div class="blur" id="top"></div><div class="blur" id="bot"></div><div id="cap">ДВАЖДЫ</div><script src="lib/three.min.js"></script><script>
const W=1080,H=1920;const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W,H,false);r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.outputEncoding=THREE.sRGBEncoding;document.body.prepend(r.domElement);
const s=new THREE.Scene();
const bg=document.createElement('canvas');bg.width=2;bg.height=256;const bq=bg.getContext('2d');const gg=bq.createLinearGradient(0,0,0,256);gg.addColorStop(0,'#bfe3f2');gg.addColorStop(1,'#f3e3cc');bq.fillStyle=gg;bq.fillRect(0,0,2,256);s.background=new THREE.CanvasTexture(bg);
const cam=new THREE.PerspectiveCamera(26,W/H,0.1,200);cam.position.set(7,10,30);cam.lookAt(0,3.4,-2);
s.add(new THREE.HemisphereLight(0xfff4e0,0xd8c0a0,0.6));const sun=new THREE.DirectionalLight(0xfff0d8,1.0);sun.position.set(-8,16,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.radius=8;Object.assign(sun.shadow.camera,{left:-15,right:15,top:15,bottom:-15});s.add(sun);
const P=(c,ro=0.3)=>new THREE.MeshStandardMaterial({color:c,roughness:ro,metalness:0});
const add=(geo,c,x,y,z,ro)=>{const m=new THREE.Mesh(geo,P(c,ro));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;s.add(m);return m};
// table
add(new THREE.BoxGeometry(60,1,40),0xe8c9a0,0,-0.5,0,0.6);
const rbox=(w,h,d,rad)=>{const sh=new THREE.Shape();const x=-w/2,y=-h/2;sh.moveTo(x+rad,y);sh.lineTo(x+w-rad,y);sh.quadraticCurveTo(x+w,y,x+w,y+rad);sh.lineTo(x+w,y+h-rad);sh.quadraticCurveTo(x+w,y+h,x+w-rad,y+h);sh.lineTo(x+rad,y+h);sh.quadraticCurveTo(x,y+h,x,y+h-rad);sh.lineTo(x,y+rad);sh.quadraticCurveTo(x,y,x+rad,y);const g=new THREE.ExtrudeGeometry(sh,{depth:d,bevelEnabled:true,bevelThickness:0.15,bevelSize:0.15,bevelSegments:6});g.translate(0,0,-d/2);return g};
// toy train
add(rbox(4.2,2,2.2,0.5),0x7fb8e0,-4,1.4,-2);add(rbox(1.6,1.4,2.0,0.4),0xf2a65a,-2.6,2.9,-2);add(new THREE.CylinderGeometry(0.35,0.45,1.1,24),0xe05a4a,-5.2,2.8,-2);
[-5.3,-4,-2.7].forEach(x=>{const w=add(new THREE.CylinderGeometry(0.55,0.55,2.5,32),0x404858,x,0.55,-2);w.rotation.x=Math.PI/2});
// toy houses
const house=(x,z,c,rc)=>{add(rbox(1.8,1.8,1.8,0.3),c,x,0.9,z);const roof=add(new THREE.ConeGeometry(1.5,1.2,4),rc,x,2.4,z);roof.rotation.y=Math.PI/4};
house(4,-5,0xfff3d8,0xe05a4a);house(6.2,-3.5,0xd8f0e0,0x5a8ae0);house(-8,-6,0xffe0e8,0xf2a65a);
// cloud toy (soft puff)
[[2.5,6.5,-8,1.6],[3.8,7.1,-8,1.9],[5.2,6.6,-8,1.5],[3.8,5.6,-7.4,1.3]].forEach(([x,y,z,rr])=>add(new THREE.SphereGeometry(rr,40,40),0xfff8ee,x,y,z,0.5));
add(new THREE.CylinderGeometry(0.6,0.9,5,32),0xf3e6d6,3.8,2.5,-8,0.5);add(new THREE.TorusGeometry(1.2,0.3,16,40),0xffc890,3.8,3.2,-8,0.5).rotation.x=Math.PI/2;
// hero figurine
const g=new THREE.Group();const fm=(geo,c,x,y,z)=>{const m=new THREE.Mesh(geo,P(c,0.25));m.position.set(x,y,z);m.castShadow=true;g.add(m);return m};
fm(new THREE.CylinderGeometry(0.75,0.95,1.9,40),0x3f6fb8,0,1.5,0);fm(new THREE.SphereGeometry(0.75,40,40),0x3f6fb8,0,2.4,0).scale.set(1,0.55,1);
fm(new THREE.SphereGeometry(0.85,48,48),0xffd9b8,0,3.35,0);
fm(new THREE.SphereGeometry(0.9,48,48),0x3a2e2a,0,3.55,-0.08).scale.set(1,0.62,1);
fm(new THREE.TorusGeometry(0.86,0.12,16,48),0xffffff,0,3.6,0).rotation.x=Math.PI/2.2;
[-0.28,0.28].forEach(x=>fm(new THREE.SphereGeometry(0.09,16,16),0x222222,x,3.35,0.78));
[-0.5,0.5].forEach(x=>fm(new THREE.SphereGeometry(0.14,16,16),0xf6a0a0,x*1.0,3.15,0.68));
[-0.35,0.35].forEach(x=>fm(new THREE.CylinderGeometry(0.28,0.3,0.6,24),0x3a3a4a,x,0.3,0));
fm(new THREE.SphereGeometry(0.25,20,20),0xffd9b8,1.05,1.3,0.1);fm(new THREE.CylinderGeometry(0.22,0.22,1.2,20),0x3f6fb8,0.95,1.9,0.05).rotation.z=0.25;
const cs=fm(rbox(1.3,0.95,0.45,0.18),0xb5652e,1.45,0.6,0.15);
g.position.set(0.5,0,3);g.rotation.y=-0.35;s.add(g);
// rails
for(let i=-8;i<4;i++)add(new THREE.BoxGeometry(0.5,0.15,3),0xb08060,i*1.1,0.05,-2);
r.render(s,cam);window.READY=1;
</script></body></html>
