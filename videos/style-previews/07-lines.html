<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head><body>
<svg width="1080" height="1920" viewBox="0 0 1080 1920" font-family="Inter,sans-serif" id="s">
<rect width="1080" height="1920" fill="#000"/>
<g fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"><circle cx="680" cy="560" r="420"/><circle cx="680" cy="560" r="600"/><circle cx="300" cy="1150" r="500"/></g>
<g fill="none" stroke="#fff" stroke-width="2" id="waves"></g>

<text x="540" y="1460" text-anchor="middle" font-size="56" font-weight="200" fill="#fff" letter-spacing="22">ДВАЖДЫ</text>
<line x1="330" y1="1495" x2="750" y2="1495" stroke="#fff" stroke-width="1.5"/>
</svg><script>
const shapes=[
 [[630,1060],[640,820],[600,760],[520,740],[500,660],[560,600],[620,560],[700,555],[780,590],[850,660],[820,740],[740,760],[720,820],[730,1060]],
 [[560,880],[680,860],[800,880],[680,910]],
 [[150,1060],[150,900],[250,900],[250,1060]],[[280,1060],[280,960],[360,960],[360,1060]],[[880,1060],[880,940],[980,940],[980,1060]],
];
let sh='',vt='';
shapes.forEach(p=>{sh+=`<polyline points="${p.map(q=>q.join(',')).join(' ')}"/>`;p.forEach(q=>vt+=`<circle cx="${q[0]}" cy="${q[1]}" r="7"/>`)});

document.getElementById('verts').innerHTML=vt+`<circle cx="400" cy="860" r="34"/><line x1="400" y1="894" x2="400" y2="990" stroke="#fff" stroke-width="5"/><line x1="400" y1="920" x2="350" y2="980" stroke="#fff" stroke-width="5"/><line x1="400" y1="920" x2="470" y2="985" stroke="#fff" stroke-width="5"/><line x1="400" y1="990" x2="370" y2="1060" stroke="#fff" stroke-width="5"/><line x1="400" y1="990" x2="430" y2="1060" stroke="#fff" stroke-width="5"/>`;
let w='';[60,120,190,270,360].forEach((r,i)=>w+=`<circle cx="680" cy="640" r="${r}" stroke-opacity="${0.6-i*0.11}"/>`);document.getElementById('waves').innerHTML=w;
let cr='';for(let row=0;row<6;row++)for(let i=0;i<34;i++){const x=40+i*30,y=1160+row*32+Math.sin(i*0.45+row*0.6)*14;const k=0.35+0.65*Math.max(0,Math.sin(i*0.45-row*0.3));cr+=`<circle cx="${x}" cy="${y}" r="${3+k*3}" opacity="${0.25+k*0.75}"/>`}
document.getElementById('crowd').innerHTML=cr;window.READY=1</script></body></html>
