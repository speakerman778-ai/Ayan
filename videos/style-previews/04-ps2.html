<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;overflow:hidden}canvas{width:1080px;height:1920px;display:block;filter:blur(0.6px) contrast(1.05)}
#cap{position:absolute;left:0;right:0;top:1395px;text-align:center;font:bold 64px 'DejaVu Sans Mono',monospace;color:#e8e2c0;letter-spacing:6px;text-shadow:4px 4px 0 #000,-2px -2px 0 #000}
#cap small{display:block;font-size:30px;color:#9fc0e0;letter-spacing:4px;margin-top:8px}
</style></head><body><div id="cap">ДВАЖДЫ<small>— ГЛАВА 2: НАГАСАКИ —</small></div><script src="lib/three.min.js"></script><script>
const W=540,H=960;const r=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});r.setPixelRatio(1);r.setSize(W,H,false);document.body.prepend(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0x3a3550);s.fog=new THREE.Fog(0x4a3f5a,12,60);
const cam=new THREE.PerspectiveCamera(55,W/H,0.1,200);cam.position.set(2.0,1.5,15);cam.lookAt(-0.5,5.5,-10);
s.add(new THREE.HemisphereLight(0xb0a0d0,0x302830,0.7));const d=new THREE.DirectionalLight(0xffb070,0.9);d.position.set(-5,8,-10);s.add(d);
const M=c=>new THREE.MeshLambertMaterial({color:c,flatShading:true});
const box=(w,h,dd,c,x,y,z,p=s)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,dd),M(c));m.position.set(x,y,z);p.add(m);return m};
// ground with checker texture
const cv=document.createElement('canvas');cv.width=cv.height=64;const g=cv.getContext('2d');for(let i=0;i<8;i++)for(let j=0;j<8;j++){g.fillStyle=(i+j)%2?'#5a5048':'#4a4240';g.fillRect(i*8,j*8,8,8)}
const tx=new THREE.CanvasTexture(cv);tx.magFilter=THREE.NearestFilter;tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(20,20);
const gr=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshLambertMaterial({map:tx}));gr.rotation.x=-Math.PI/2;s.add(gr);
// platform + rails
box(30,0.6,4,0x6a6070,0,0.3,2);for(let i=-15;i<15;i+=1.2)box(0.3,0.15,3,0x3a3030,i,0.08,-2.2);box(30,0.1,0.15,0x8a8a90,0,0.2,-1.3);box(30,0.1,0.15,0x8a8a90,0,0.2,-3.1);
// station roof posts
[-6,-1,4].forEach(x=>{box(0.3,4,0.3,0x5a5060,x,2.6,3);});box(16,0.3,3,0x504860,-1,4.7,2.6);
// buildings
for(let i=0;i<14;i++){const h=2+((i*7)%5)*1.6;box(2.6,h,2.6,i%2?0x504a62:0x5a5470,-18+i*3,h/2,-14-(i%3)*3)}
// mushroom of icosahedrons
const glow=new THREE.MeshBasicMaterial({color:0xffe0a0,fog:false});
for(let i=0;i<10;i++){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(0.9+i*0.05,0),M(0xd8c8b0));m.position.set(-4+Math.sin(i)*0.4,1+i*1.6,-30);m.scale.setScalar(1+i*0.04);s.add(m)}
for(let i=0;i<22;i++){const a=i/22*Math.PI*2,rr=3+Math.sin(i*3)*0.8;const m=new THREE.Mesh(new THREE.IcosahedronGeometry(2.0,0),i%3?M(0xf0e4d0):M(0xd0b090));m.position.set(-4+Math.cos(a)*rr,17+Math.sin(i*1.7)*1.2,-30+Math.sin(a)*rr);s.add(m)}
const sun=new THREE.Mesh(new THREE.IcosahedronGeometry(3,1),glow);sun.position.set(-4,17,-34);s.add(sun);
// sparks
for(let i=0;i<30;i++){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(0.18,0),new THREE.MeshBasicMaterial({color:0xffffff}));m.position.set(-4+(Math.random()-.5)*16,4+Math.random()*16,-26+(Math.random()-.5)*6);s.add(m)}
// box people
const person=(x,z,c,ry,wave)=>{const p=new THREE.Group();box(0.7,0.9,0.4,c,0,1.95,0,p);box(0.6,0.55,0.55,0xe0b090,0,2.75,0,p);box(0.62,0.18,0.6,0x2a2a30,0,3.05,0,p);
 box(0.25,0.9,0.25,0x30303a,-0.18,1.05,0,p);box(0.25,0.9,0.25,0x30303a,0.18,1.05,0,p);
 const a1=box(0.22,0.8,0.22,c,-0.48,2.0,0,p);const a2=box(0.22,0.8,0.22,c,0.48,2.0,0,p);if(wave){a2.position.set(0.6,2.6,0);a2.rotation.z=2.4}
 p.position.set(x,0.6,z);p.rotation.y=ry;s.add(p);return p};
const hero=person(0.6,1.5,0x2a4a7a,0.35,false);box(0.7,0.5,0.25,0x7a4a2a,0.65,1.0,0.1,hero);
box(0.62,0.12,0.4,0xf0f0f0,0,2.85,0.1,hero).rotation.z=0.4;
person(-2.5,2.3,0x7a2a2a,0.6,true);person(-4.2,1.6,0x3a6a3a,0.9,true);person(3.3,2.6,0x6a5a2a,-0.3,false);
r.render(s,cam);window.READY=1;
</script></body></html>
