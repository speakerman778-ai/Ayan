<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head><body>
<svg width="1080" height="1920" viewBox="0 0 1080 1920" font-family="'DejaVu Serif',serif">
<defs>
<filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
 <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="4" result="t"/>
 <feDisplacementMap in="SourceGraphic" in2="t" scale="38" result="d"/>
 <feGaussianBlur in="d" stdDeviation="5" result="b"/>
 <feComposite in="b" in2="d" operator="arithmetic" k1="0" k2="0.65" k3="0.5" k4="0"/>
</filter>
<filter id="edge" x="-20%" y="-20%" width="140%" height="140%">
 <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="9" result="t"/>
 <feDisplacementMap in="SourceGraphic" in2="t" scale="26" result="d"/>
 <feMorphology in="d" operator="erode" radius="3" result="e"/>
 <feComposite in="d" in2="e" operator="out" result="rim"/>
 <feGaussianBlur in="d" stdDeviation="3" result="soft"/>
 <feMerge><feMergeNode in="soft"/><feMergeNode in="rim"/></feMerge>
</filter>
<filter id="ink"><feTurbulence baseFrequency="0.04" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="1"/><feColorMatrix type="matrix" values="0 0 0 0 0.45 0 0 0 0 0.38 0 0 0 0 0.3 0 0 0 0.12 0"/></filter>
