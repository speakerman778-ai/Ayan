<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{width:1080px;height:1920px;image-rendering:pixelated;display:block}</style></head><body>
<canvas id="c" width="270" height="480"></canvas><script>
const c=document.getElementById('c').getContext('2d');const px=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
// 16-bit night sky bands
['#0d0b26','#141236','#1b1a48','#23255a','#2c326c','#363f7c'].forEach((col,i)=>{px(0,i*45,270,45,col);for(let x=(i%2)*2;x<270;x+=4)px(x,i*45+44,2,1,col)});
for(let i=0;i<70;i++){const x=(i*97)%270,y=(i*61)%250;px(x,y,1,1,i%6?'#c8c8ff':'#fff4b0');if(i%9==0){px(x-1,y,3,1,'#8a8ad8');px(x,y-1,1,3,'#8a8ad8')}}
// moon
for(let y=-20;y<=20;y++)for(let x=-20;x<=20;x++)if(x*x+y*y<=400)px(215+x,65+y,1,1,(x*x+y*y>300)?'#e8d898':'#fff4c8');px(208,58,5,5,'#e8d898');px(222,70,4,4,'#e8d898');
// beam (dithered)
for(let y=0;y<90;y++)for(let x=0;x<190;x++){const yy=112-(y-45)*(x/190);if(Math.abs(y-45)<x*0.25+3&&(x+y)%2==0)px(75+x,112-45+y-(x*0.15),1,1,'rgba(255,240,170,.35)')}
// sea
px(0,270,270,210,'#1a3a6a');for(let r=0;r<12;r++)for(let x=(r%2)*6;x<270;x+=12){px(x,282+r*16,6,1,'#4a7ab0');px(x+2,281+r*16,2,1,'#8ab0e0')}
// cliff
for(let y=240;y<480;y++){const w=170+Math.sin(y*0.05)*10+(y-240)*0.05;px(0,y,w,1,y<244?'#4a9a4a':'#6a5a4a');if(y>244&&y%6==0)px(w-6,y,6,1,'#4a3e34')}
for(let i=0;i<30;i++)px((i*37)%150,250+(i*53)%220,3,2,'#5a4a3c');
// lighthouse
const T={w:'#eeeeee',r:'#d0302a',k:'#18142a',y:'#ffd040',g:'#3a3a5a',b:'#7a4a2a'};
const tower=['....kkkkk.....','...kryyyrk....','...kyyyyyk....','..kkkkkkkkk...','...kwwwwwk....','...krrrrrk....','...krrrrrk....','...kwwwwwk....','...kwwywwk....','...kwwwwwk....','..krrrrrrrk...','..krrrrrrrk...','..kwwwwwwwk...','..kwwwwwwwk...','..kwwwbwwwk...','..kwwbbbwwk...','..kkkkkkkkk...'];
tower.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!='.')px(30+x*4,172+y*4,4,4,T[ch])}));
// keeper + cat
const K={k:'#18142a',y:'#f0c020',s:'#f2c49a',w:'#f0f0f0',l:'#ffe080',b:'#3a3a5a',o:'#f08a30'};
const keeper=['..kkkkk.....','.kyyyyyk....','kyyyyyyyk...','..kssssk....','..ksksk.....','..kwwwwk....','..kywwyk.kk.','.kyyyyyykblk','.kyyyyyyk.kk','.kyyyyyyk...','.kyyyyyyk...','..kk..kk....','..kk..kk....'];
keeper.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!='.')px(100+x*3,206+y*3,3,3,K[ch])}));
for(let y=-6;y<=6;y++)for(let x=-6;x<=6;x++)if(x*x+y*y<36&&(x+y)%2==0)px(131+x,227+y,1,1,'rgba(255,224,128,.5)');
const cat=['k...k','kokok','ooooo','.ooo.','.ooo.','oooook'];
cat.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!='.')px(140+x*2,233+y*2,2,2,ch=='k'?'#18142a':'#f08a30')}));
// HUD
px(4,4,262,24,'#18142a');px(5,5,260,22,'#2c2a50');c.font='bold 9px monospace';c.fillStyle='#ffd040';c.fillText('НОЧЬ 1',10,19);c.fillStyle='#fff';c.fillText('🏮',90,19);
px(110,12,90,7,'#18142a');px(111,13,60,5,'#ffd040');c.fillStyle='#c8c8ff';c.fillText('СВЕТ',206,19);
// caption
px(40,350,190,22,'#18142a');px(41,351,188,20,'#ffd040');c.font='bold 13px monospace';c.fillStyle='#18142a';c.fillText('СМОТРИТЕЛЬ',95,366);
window.READY=1;
</script></body></html>
